# ---------------------------------------------------------------------------
# Phase 0: Project Setup & Skeleton - .pre-commit-config.yaml
# Automatically formats/lints Python code before every git commit.
# ---------------------------------------------------------------------------

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version pins the formatter + linter behaviour.
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files