# ---------------------------------------------------------------------------
# Phase 0: Project Setup & Skeleton - pyproject.toml
# Project metadata and Ruff linting / formatting configuration.
# ---------------------------------------------------------------------------

[project]
name = "realtime-fleet-analytics"
version = "0.1.0"
description = "Real-Time Geospatial Fleet Analytics Engine"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["generator", "api", "processor"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["I"]
"ui/**" = ["I", "E"]