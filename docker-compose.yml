# ---------------------------------------------------------------------------
# Phase 1: Core Services Containerization
# docker-compose orchestration for Redpanda (broker), ClickHouse (OLAP),
# and Redis (state store) on a shared custom bridge network.
#
# Usage: docker compose up -d
# ---------------------------------------------------------------------------

services:
  # -------------------------------------------------------------------------
  # Message Broker: Redpanda (Kafka-compatible, C++, low memory footprint)
  # Two Kafka listeners, because a broker must advertise an address its
  # clients can resolve:
  #   internal -> redpanda:29092  (containers on data-mesh)
  #   external -> localhost:9092  (tools/scripts on the host)
  # -------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.3.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - "0M"
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    networks:
      - data-mesh
    volumes:
      - redpanda_data:/var/lib/redpanda
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # -------------------------------------------------------------------------
  # OLAP Storage: ClickHouse (fast OLAP queries)
  # HTTP: 8123, Native: 9000.
  # Credentials come from .env; the image disables network access for a
  # passwordless default user, so a password is required.
  # -------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:26.10.4.207
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - data-mesh
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env (see .env.example)}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # -------------------------------------------------------------------------
  # State Store: Redis (O(1) latest vehicle state)
  # Exposes port 6379.
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server"]
    ports:
      - "6379:6379"
    networks:
      - data-mesh
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 5s

  # -------------------------------------------------------------------------
  # Data Generator: Python synthetic telemetry producer
  # Idle until a simulation is started from the UI (through the API). Each
  # simulation streams fleet telemetry into the telemetry_raw topic for its
  # duration; vehicles, interval and chaos come from the request, not from here.
  # -------------------------------------------------------------------------
  generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    container_name: generator
    restart: unless-stopped
    environment:
      - BOOTSTRAP_SERVERS=redpanda:29092
      - TOPIC=telemetry_raw
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - data-mesh
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Stream Processor: consumes telemetry_raw, routes DLQ, sinks to Redis/CH
  # -------------------------------------------------------------------------
  processor:
    build:
      context: .
      dockerfile: processor/Dockerfile
    container_name: processor
    restart: unless-stopped
    environment:
      - BOOTSTRAP_SERVERS=redpanda:29092
      - INPUT_TOPIC=telemetry_raw
      - DLQ_TOPIC=telemetry_dlq
      - CONSUMER_GROUP=stream-processor
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env (see .env.example)}
      - CLICKHOUSE_DB=fleet_analytics
      - WINDOW_SECONDS=10
      - ALLOWED_LATENESS_SECONDS=5
      - CHECKPOINT_INTERVAL=10
      - STATE_TTL_SECONDS=60
      - H3_RESOLUTION=9
      - LOG_LEVEL=${PROCESSOR_LOG_LEVEL:-INFO}
    networks:
      - data-mesh
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Serving API: FastAPI (SSE live feed, DLQ metrics, health, simulation control)
  # Swagger UI at http://localhost:8000/docs
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env (see .env.example)}
      - CLICKHOUSE_DB=fleet_analytics
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - SIMULATION_DURATION_SECONDS=${SIMULATION_DURATION_SECONDS:-120}
      - SIMULATION_HEARTBEAT_TIMEOUT_SECONDS=${SIMULATION_HEARTBEAT_TIMEOUT_SECONDS:-10}
    networks:
      - data-mesh
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      args:
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
        VITE_DLQ_ALERT_RATIO: ${VITE_DLQ_ALERT_RATIO:-0.1}
    container_name: ui
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - data-mesh
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Custom bridge network so services reach each other via Docker DNS
# (e.g., ping redpanda / clickhouse / redis from any container).
# ---------------------------------------------------------------------------
networks:
  data-mesh:
    driver: bridge

# ---------------------------------------------------------------------------
# Named volumes to persist data across container restarts.
# ---------------------------------------------------------------------------
volumes:
  redpanda_data:
  clickhouse_data:
  redis_data:
